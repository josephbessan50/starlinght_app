<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Mon espace — Starlinght Team</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy:#003366; --navy-dark:#001f3f; --gold:#FFD700; --gold-dark:#e6c200;
    --bg:#f4f6fa; --card:#ffffff; --text:#1c2b3a; --muted:#6b7a8d; --border:#e1e6ee; --danger:#e0473e;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Poppins',sans-serif;background:
      radial-gradient(circle at 20% 20%, rgba(255,215,0,0.15), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(255,215,0,0.1), transparent 45%),
      linear-gradient(160deg, var(--navy-dark), var(--navy) 60%);
    min-height:100vh;color:var(--text);-webkit-tap-highlight-color:transparent;
  }
  .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{
    background:var(--card);width:100%;max-width:440px;border-radius:var(--radius);
    padding:32px 26px;box-shadow:0 20px 50px rgba(0,20,50,0.35);border-top:5px solid var(--gold);
  }
  .brand-star{
    width:52px;height:52px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--navy),var(--navy-dark));border-radius:16px;
  }
  .brand-star svg{width:26px;height:26px;}
  h1{font-size:1.2rem;font-weight:800;color:var(--navy);margin:0 0 4px;text-align:center;}
  .sub{color:var(--muted);font-size:0.85rem;margin-bottom:22px;text-align:center;}
  .field{text-align:left;margin-bottom:16px;}
  .field label{display:block;font-size:0.78rem;font-weight:600;color:var(--navy);margin-bottom:6px;}
  input, textarea{
    width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;
    font-family:'Poppins',sans-serif;font-size:0.95rem;color:var(--text);background:#fbfcfe;
  }
  input:focus, textarea:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(0,51,102,0.12);}
  textarea{resize:vertical;min-height:80px;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:10px;
    padding:12px 18px;font-family:'Poppins',sans-serif;font-weight:600;font-size:0.92rem;cursor:pointer;width:100%;
  }
  .btn:disabled{opacity:0.5;cursor:not-allowed;}
  .btn-primary{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:var(--navy-dark);box-shadow:0 8px 18px rgba(255,215,0,0.35);}
  .error-msg{color:var(--danger);font-size:0.82rem;margin:-6px 0 12px;min-height:16px;font-weight:500;}
  .counter-row{display:flex;align-items:center;justify-content:center;gap:16px;margin:10px 0 4px;}
  .counter-btn{
    width:44px;height:44px;border-radius:12px;border:1.5px solid var(--border);background:#f0f4f9;
    color:var(--navy);font-weight:700;font-size:1.3rem;cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .counter-btn:disabled{opacity:0.4;cursor:not-allowed;}
  .counter-value{font-size:2rem;font-weight:800;color:var(--navy);min-width:50px;text-align:center;}
  .counter-label{text-align:center;color:var(--muted);font-size:0.76rem;margin-bottom:18px;}
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy-dark);
    color:#fff;padding:12px 20px;border-radius:10px;font-size:0.85rem;font-weight:500;
    box-shadow:0 8px 24px rgba(0,0,0,0.25);opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;
    z-index:100;border-left:4px solid var(--gold);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.error{border-left-color:var(--danger);}
  [hidden]{display:none !important;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="brand-star">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L14.5 9H22L16 13.5L18 21L12 16.5L6 21L8 13.5L2 9H9.5L12 2Z" fill="#FFD700"/>
      </svg>
    </div>
    <h1>Mon espace personnel</h1>
    <div class="sub">Starlinght Team — Suivi de ta progression</div>

    <!-- Écran mot de passe -->
    <div id="unlock-screen">
      <div class="field">
        <label for="access-password">Ton code d'accès</label>
        <input type="password" id="access-password" placeholder="ex: 4821" inputmode="numeric">
      </div>
      <div class="error-msg" id="unlock-error"></div>
      <button class="btn btn-primary" id="unlock-btn">Accéder à mon espace</button>
    </div>

    <!-- Espace prospect -->
    <div id="prospect-screen" hidden>
      <div id="welcome-text" style="text-align:center;font-weight:600;color:var(--navy);margin-bottom:16px;"></div>

      <div class="counter-label">Combien de personnes as-tu enregistrées dans ton business ?</div>
      <div class="counter-row">
        <button class="counter-btn" id="counter-minus">−</button>
        <div class="counter-value" id="counter-value">0</div>
        <button class="counter-btn" id="counter-plus">+</button>
      </div>

      <form id="update-form">
        <div class="field">
          <label for="up-telephone">Mon téléphone</label>
          <input type="tel" id="up-telephone">
        </div>
        <div class="field">
          <label for="up-ville">Ma ville</label>
          <input type="text" id="up-ville">
        </div>
        <div class="field">
          <label for="up-motivation">Ma motivation</label>
          <input type="text" id="up-motivation">
        </div>
        <button type="submit" class="btn btn-primary" id="update-btn">Enregistrer mes infos</button>
      </form>
    </div>

    <div id="loading-text" style="text-align:center;color:var(--muted);font-size:0.85rem;">Chargement...</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = "https://hzkvetfathhtbjrtqjsc.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_5_x-M_wcgFhA5Hf0CS8XLA_gq0V6Okz";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

let prospectId = null;
let prospectData = null;

function showToast(message, isError = false){
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.toggle('error', isError);
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove('show'), 2600);
}

function init(){
  const params = new URLSearchParams(window.location.search);
  prospectId = params.get('id');
  document.getElementById('loading-text').hidden = true;

  if(!prospectId){
    document.getElementById('unlock-error').textContent = "Lien invalide — demande un nouveau lien à ton contact Starlinght.";
    document.getElementById('unlock-btn').disabled = true;
    return;
  }
}

document.getElementById('unlock-btn').addEventListener('click', async () => {
  const password = document.getElementById('access-password').value;
  const errorEl = document.getElementById('unlock-error');
  const btn = document.getElementById('unlock-btn');

  if(!password){ errorEl.textContent = "Entre ton code d'accès."; return; }

  errorEl.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Vérification...';

  const { data, error } = await supabaseClient
    .from('prospects_leaders')
    .select('*')
    .eq('id', prospectId)
    .eq('mot_de_passe', password)
    .maybeSingle();

  btn.disabled = false;
  btn.textContent = 'Accéder à mon espace';

  if(error){ errorEl.textContent = "Erreur : " + error.message; return; }
  if(!data){ errorEl.textContent = "Code d'accès incorrect."; return; }

  prospectData = data;
  document.getElementById('unlock-screen').hidden = true;
  document.getElementById('prospect-screen').hidden = false;
  document.getElementById('welcome-text').textContent = `Bonjour ${data.nom} 👋`;
  document.getElementById('counter-value').textContent = Number(data.nb_personnes_recrutees) || 0;
  document.getElementById('up-telephone').value = data.telephone || '';
  document.getElementById('up-ville').value = data.ville || '';
  document.getElementById('up-motivation').value = data.motivation || '';
});

document.getElementById('counter-minus').addEventListener('click', () => adjustCounter(-1));
document.getElementById('counter-plus').addEventListener('click', () => adjustCounter(1));

async function adjustCounter(delta){
  const current = Number(prospectData.nb_personnes_recrutees) || 0;
  const newVal = Math.max(0, current + delta);
  if(newVal === current) return;

  document.getElementById('counter-value').textContent = newVal;
  prospectData.nb_personnes_recrutees = newVal;

  const { error } = await supabaseClient
    .from('prospects_leaders')
    .update({ nb_personnes_recrutees: newVal })
    .eq('id', prospectId);

  if(error){
    showToast("Erreur : " + error.message, true);
    document.getElementById('counter-value').textContent = current;
    prospectData.nb_personnes_recrutees = current;
  } else {
    showToast("Mis à jour ✓");
  }
}

document.getElementById('update-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('update-btn');
  const updates = {
    telephone: document.getElementById('up-telephone').value.trim(),
    ville: document.getElementById('up-ville').value.trim(),
    motivation: document.getElementById('up-motivation').value.trim()
  };
  btn.disabled = true;
  btn.textContent = 'Enregistrement...';

  const { error } = await supabaseClient.from('prospects_leaders').update(updates).eq('id', prospectId);

  btn.disabled = false;
  btn.textContent = 'Enregistrer mes infos';

  if(error){ showToast("Erreur : " + error.message, true); return; }
  showToast("Tes infos ont été mises à jour ✓");
});

init();
</script>
</body>
</html>
